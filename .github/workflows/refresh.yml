name: Refresh news and publish

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the rolling story store
        run: |
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:ksnews_store.json > raw/feeds/ksnews_store.json
            git show FETCH_HEAD:ksop_store.json > raw/feeds/ksop_store.json
            echo "restored store from the state branch"
          else
            echo "no state branch yet; starting from the seed store on main"
          fi

      - name: Pull feeds
        run: python3 build/fetch_feeds.py

      - name: Rebuild news and trending
        working-directory: build
        run: python3 trend.py

      - name: Checks before publishing
        id: check
        continue-on-error: true
        run: python3 build/check.py

      - name: Save the story store
        run: |
          mkdir "$RUNNER_TEMP/state" && cd "$RUNNER_TEMP/state"
          cp "$GITHUB_WORKSPACE/raw/feeds/ksnews_store.json" "$GITHUB_WORKSPACE/raw/feeds/ksop_store.json" "$GITHUB_WORKSPACE/build/pull_status.json" .
          git init -q -b state
          git add .
          git -c user.name="keystone-post-bot" -c user.email="actions@users.noreply.github.com" commit -qm "story store $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" state

      - name: Assemble the site
        if: steps.check.outcome == 'success'
        run: |
          mkdir _site
          cp site-src/index.html robots.txt _site/
          cp -r site _site/site
          touch _site/.nojekyll

      - name: Lock the site with the access code, if one is set
        if: steps.check.outcome == 'success'
        env:
          SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
        run: |
          if [ -n "$SITE_PASSCODE" ]; then
            pip install -q cryptography
            python3 build/encrypt_site.py _site
          else
            echo "No SITE_PASSCODE secret is set, so the site is published open."
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outcome == 'success'
        with:
          path: _site

      - id: deploy
        if: steps.check.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Fail the run if the checks failed
        if: steps.check.outcome != 'success'
        run: |
          echo "Checks failed, so the live site was left as it is."
          exit 1
